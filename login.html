<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易加云蜂窝店 - 管理员登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(30, 136, 229, 0.2);
      padding: 48px;
      width: 100%;
      max-width: 420px;
    }

    .logo-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-section img {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      margin-bottom: 16px;
    }

    .logo-section h1 {
      font-size: 24px;
      color: #1A1A1A;
      margin-bottom: 8px;
    }

    .logo-section p {
      font-size: 14px;
      color: #666666;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #333333;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #E8E8E8;
      border-radius: 12px;
      font-size: 15px;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-group input:focus {
      border-color: #1E88E5;
      box-shadow: 0 0 0 4px rgba(30, 136, 229, 0.1);
    }

    .form-group input::placeholder {
      color: #BBBBBB;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1E88E5 0%, #42A5F5 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 16px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(30, 136, 229, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-message {
      background: #FFF5F5;
      border: 1px solid #FFE0E0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #E53935;
      font-size: 13px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #999999;
    }
    
    @media (max-width: 480px) {
      .login-container {
        padding: 24px 16px;
        margin: 0 12px;
        border-radius: 20px;
      }
      
      .logo-section {
        margin-bottom: 24px;
      }
      
      .logo-section img {
        width: 56px;
        height: 56px;
        margin-bottom: 12px;
      }
      
      .logo-section h1 {
        font-size: 18px;
      }
      
      .logo-section p {
        font-size: 12px;
      }
      
      .form-group {
        margin-bottom: 16px;
      }
      
      .form-group label {
        font-size: 13px;
        margin-bottom: 6px;
      }
      
      .form-group input {
        padding: 12px 14px;
        font-size: 14px;
        border-radius: 10px;
      }
      
      .login-btn {
        padding: 12px;
        font-size: 14px;
        border-radius: 10px;
        margin-top: 12px;
      }
      
      .error-message {
        padding: 10px 14px;
        font-size: 12px;
        border-radius: 8px;
      }
      
      .footer {
        margin-top: 20px;
        font-size: 11px;
      }
    }
    
    @media (max-width: 360px) {
      .login-container {
        padding: 20px 14px;
      }
      
      .logo-section h1 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <img src="易加云.png" alt="易加云">
      <h1>易加云蜂窝店</h1>
      <p>管理员后台</p>
    </div>

    <div class="error-message" id="errorMessage">账户或密码错误</div>

    <form id="loginForm">
      <div class="form-group">
        <label>账户</label>
        <input type="text" id="username" placeholder="请输入账户">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
      </div>
      <button type="submit" class="login-btn">登录</button>
    </form>

    <div class="footer">
      © 2026 江苏易加云网络科技有限公司
    </div>
  </div>

  <script>
    // 检查是否已登录
    if (localStorage.getItem('adminLoggedIn') === 'true') {
      window.location.href = 'admin.html';
    }

    const form = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      // 验证账户密码
      if (username === 'yjypgy' && password === '952012') {
        // 登录成功
        localStorage.setItem('adminLoggedIn', 'true');
        window.location.href = 'admin.html';
      } else {
        // 登录失败
        errorMessage.classList.add('show');
        setTimeout(() => {
          errorMessage.classList.remove('show');
        }, 3000);
      }
    });
  </script>
</body>
</html>
